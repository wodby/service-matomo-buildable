name: matomo-buildable
type: service
icon: matomo
title: Matomo (buildable)
from: matomo
fromVersionConstraint: "^3.0.0"
fromVersion: "3.0.1"
guidance: GUIDANCE.md

labels:
- matomo

# PHP versions of wodby/matomo-php: PHP-FPM and Apache with Wodby's setup for
# Matomo, without Matomo. The build installs the Matomo release the app
# repository pins in .matomo-version.
options:
- version: '8.4'
  tag: 8.4-r0
  default: true

build:
  connect: true
  dockerfile: Dockerfile
  boilerplates:
  - name: vanilla
    title: Vanilla Matomo
    repo: https://github.com/wodby/matomo-boilerplate
    branch: main

actions:
# Installs Matomo on the first deployment and updates its database on later
# ones, then activates the app repository's plugins and deactivates the ones
# removed from it.
- name: update
  title: Install or update Matomo
  args:
  - matomo-update-app
  type: post_deploy

# The image is built from the app repository on top of wodby/matomo-php.
workloads:
- name: main
  containers:
  - name: php
    image: wodby/matomo-php
    build: true
